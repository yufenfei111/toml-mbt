name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  check-test-and-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        uses: hustcer/setup-moonbit@v1.16
        with:
          version: latest

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Type check
        run: moon check --deny-warn

      - name: Run tests
        run: moon test

      - name: Run native Workbench integration tests
        run: moon test --target native -p yufenfei111/toml-mbt/cmd/workbench

      - name: Build native Workbench CLI
        run: moon build --target native cmd/workbench

      - name: Build native toml-test decoder
        run: moon build --release --target native cmd/toml-test-decoder

      - name: Format check
        run: moon fmt --check

      - name: Enforce official toml-test v2.2.0 baseline (181 valid / 421 invalid)
        shell: pwsh
        run: |
          $outputPath = Join-Path $env:RUNNER_TEMP 'toml-test-v2.2.0-output.txt'
          $outputLines = & env TOML_TEST_DECODER_NO_BUILD=1 go run github.com/toml-lang/toml-test/v2/cmd/toml-test@v2.2.0 test -timeout 10s -parallel 1 -decoder ./scripts/toml-test-decoder.sh 2>&1
          $status = $LASTEXITCODE
          $outputLines | Write-Output
          Set-Content -LiteralPath $outputPath -Value ($outputLines -join [Environment]::NewLine) -NoNewline
          & ./scripts/check-toml-test-baseline.ps1 -InputPath $outputPath -SummaryPath $env:GITHUB_STEP_SUMMARY -Status $status
